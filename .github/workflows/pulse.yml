name: Refresh briefing

on:
  schedule:
    - cron: "30 6 * * 1"   # weekly, Mondays 06:30 UTC / 10:30 AM UAE (after the hourly news refresh)
  workflow_dispatch:          # manual run from the Actions tab

permissions:
  contents: write   # to commit the updated briefing

concurrency:
  group: pulse-refresh
  cancel-in-progress: true

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate weekly briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional overrides:
          # PULSE_MODEL: gemini-2.5-flash
          # PULSE_STORY_COUNT: "10"
        run: python3 scripts/build_pulse.py

      - name: Commit if changed
        run: |
          git config user.name "news-bot"
          git config user.email "actions@github.com"
          git add data/pulse.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh weekly briefing"
            # main may have moved (e.g. the hourly news refresh pushed) between
            # checkout and now, which makes a plain push a non-fast-forward and
            # fails the run. Rebase onto the latest main and retry a few times.
            for attempt in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then
                echo "Pushed on attempt $attempt."
                exit 0
              fi
              echo "Push attempt $attempt failed (remote moved); retrying in 5s..."
              sleep 5
            done
            echo "ERROR: could not push briefing update after 5 attempts." >&2
            exit 1
          fi
