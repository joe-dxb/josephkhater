name: Refresh briefing

on:
  # Weekly schedule is PAUSED while the Gemini key is set up.
  # Un-comment the two lines below to resume weekly runs once a manual run is green.
  # schedule:
  #   - cron: "30 6 * * 1"   # weekly, Mondays 06:30 UTC (after the hourly news refresh)
  workflow_dispatch:          # manual run from the Actions tab (used to test setup)

permissions:
  contents: write   # to commit the updated briefing

concurrency:
  group: pulse-refresh
  cancel-in-progress: true

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate weekly briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional overrides:
          # PULSE_MODEL: gemini-2.5-flash
          # PULSE_STORY_COUNT: "10"
        run: python3 scripts/build_pulse.py

      - name: Commit if changed
        run: |
          git config user.name "news-bot"
          git config user.email "actions@github.com"
          git add data/pulse.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh weekly briefing"
            git push
          fi
